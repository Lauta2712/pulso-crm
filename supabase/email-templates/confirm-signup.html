<!--
  Supabase Auth email template — Confirm signup
  Pegar el contenido de <body> en: Dashboard > Authentication > Email Templates > Confirm signup
  Variable usada: {{ .ConfirmationURL }}
-->
<div style="background-color:#0f0f11; padding:40px 0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background-color:#17171b; border:1px solid #2a2a33; border-radius:16px; overflow:hidden;">
    <tr>
      <td style="padding:32px 32px 24px 32px; text-align:center; border-bottom:1px solid #2a2a33;">
        <span style="font-size:20px; font-weight:600; color:#f0eff5; letter-spacing:0.5px;">
          Pulso<span style="color:#ff6100;">.</span>Studio
        </span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 12px 0; font-size:20px; font-weight:600; color:#f0eff5;">
          Confirmá tu cuenta
        </h1>
        <p style="margin:0 0 24px 0; font-size:14px; line-height:1.6; color:#9896a4;">
          Te invitamos a sumarte al CRM interno de Pulso Studio. Confirmá tu email para activar tu cuenta y empezar a trabajar.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px auto;">
          <tr>
            <td style="border-radius:10px; background-color:#2f6fed;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:10px;">
                Confirmar cuenta
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:0; font-size:13px; line-height:1.6; color:#5a5864;">
          Si no esperabas este email, podés ignorarlo.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px; border-top:1px solid #2a2a33; text-align:center;">
        <p style="margin:0; font-size:12px; color:#5a5864;">
          Pulso Studio · San Juan, Argentina
        </p>
      </td>
    </tr>
  </table>
</div>
